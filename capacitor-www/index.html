<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0058e6" />
  <title>oSign - Sin conexión</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f6f8; --surface:#fff; --text:#0f1720; --dim:#5b6472; --brand:#0058e6; --border:#e3e6ea; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --surface:#171a21; --text:#e8eaee; --dim:#9aa3b2; --brand:#6ea0ff; --border:#2a2f3a; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-text-size-adjust: 100%; }
    main { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      gap: 12px; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
    .logo { width: 64px; height: 64px; border-radius: 16px; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 32px; font-weight: 700; }
    h1 { margin: 8px 0 0; font-size: 24px; font-weight: 650; }
    p { margin: 0; max-width: 28rem; color: var(--dim); font-size: 16px; line-height: 1.5; }
    button { margin-top: 16px; min-height: 48px; min-width: 200px; padding: 0 24px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    @media (prefers-color-scheme: dark) { button { color: #0e1116; } .logo { color: #0e1116; } }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">o</div>
    <h1>Sin conexión</h1>
    <p>oSign necesita internet para cargar tus contratos y firmas. Comprueba tu conexión e inténtalo de nuevo.</p>
    <button type="button" id="retry">Reintentar</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      var s = document.getElementById('status');
      s.textContent = 'Comprobando…';
      fetch('https://osign.eu/manifest.webmanifest', { cache: 'no-store', mode: 'no-cors' })
        .then(function () { window.location.replace('https://osign.eu/signatures'); })
        .catch(function () { s.textContent = 'Seguimos sin conexión.'; });
    });
    window.addEventListener('online', function () { document.getElementById('retry').click(); });
  </script>
</body>
</html>
